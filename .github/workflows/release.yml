name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  flatpak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            elfutils \
            flatpak \
            flatpak-builder \
            xvfb

      - name: Add Flathub remote (user)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remotes --user

      - name: Build Flatpak bundle
        run: |
          xvfb-run --auto-servernum flatpak-builder --user \
            --repo=repo \
            --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --force-clean \
            --default-branch=master \
            --arch=x86_64 \
            --ccache \
            flatpak_app flatpak/com.maxheadroom.Headroom.json

          flatpak build-bundle repo headroom-${{ github.ref_name }}.flatpak \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            --arch=x86_64 \
            com.maxheadroom.Headroom master

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: headroom-${{ github.ref_name }}.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
