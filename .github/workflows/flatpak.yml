name: Flatpak

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            elfutils \
            flatpak \
            flatpak-builder \
            xvfb

      - name: Add Flathub remote (user)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remotes --user

      - name: Cache Flatpak builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ runner.os }}-${{ hashFiles('flatpak/com.maxheadroom.Headroom.json') }}
          restore-keys: |
            flatpak-builder-${{ runner.os }}-

      - name: Build Flatpak bundle
        run: |
          xvfb-run --auto-servernum flatpak-builder --user \
            --repo=repo \
            --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --force-clean \
            --default-branch=master \
            --arch=x86_64 \
            --ccache \
            flatpak_app flatpak/com.maxheadroom.Headroom.json

          flatpak build-bundle repo headroom.flatpak \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            --arch=x86_64 \
            com.maxheadroom.Headroom master

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: headroom-flatpak
          path: headroom.flatpak
